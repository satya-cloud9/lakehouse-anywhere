services:
  localstack:
    image: localstack/localstack:latest
    container_name: lakehouse-localstack
    ports:
      - "4566:4566"      # edge port — every emulated AWS API
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=s3,iam,sts,glue,kms,ec2,cloudwatch,logs
      - DEBUG=0
      - PERSISTENCE=1
    volumes:
      - "localstack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  localstack-data:
