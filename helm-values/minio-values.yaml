# Chart: minio/minio (https://charts.min.io/)  — repo: https://charts.min.io/
# Deployed per-tenant via terraform/tenants/_template/minio.tf's helm_release
# (namespace = that tenant's, e.g. tenant-a) -- this file is the shared
# values base every tenant's release uses.
#
# MinIO is the S3-compatible object store for that tenant's Iceberg files
# (see docs/architecture.md's "Why MinIO *and* floci..." section). Standalone
# single-drive mode — fine for a test rig, not how you'd run MinIO in production.

mode: standalone

rootUser: minioadmin
rootPassword: minioadmin   # local-only demo credential — do not reuse anywhere real

persistence:
  enabled: true
  size: 20Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# Auto-create the Iceberg warehouse bucket on startup.
buckets:
  - name: warehouse
    policy: none
    purge: false

consoleService:
  type: ClusterIP

service:
  type: ClusterIP
  port: 9000
