# Chart: prometheus-community/kube-prometheus-stack
# helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n observability -f helm-values/kube-prometheus-stack-values.yaml
#
# Sized down for a 16GB/8vCPU box running the rest of the stack alongside
# it. Alertmanager is disabled — nothing here pages anyone, and it's one
# more component competing for RAM. Re-enable if you want to test routing
# rules later.

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 6h   # this is a test rig, not a long-lived observability backend
    resources:
      requests:
        cpu: 250m
        memory: 768Mi
      limits:
        cpu: "1"
        memory: 1.5Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 8Gi
    # Auto-discover ServiceMonitors/PodMonitors in any namespace, not just
    # the release namespace — Trino/Kestra ServiceMonitors live in
    # data-plane.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false

grafana:
  enabled: true
  adminPassword: admin   # local-only demo credential — change before exposing this anywhere
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 2Gi
  # Wire in Loki and Tempo as datasources automatically once they're
  # installed (they're installed right after this chart in
  # scripts/05-deploy-stack.sh).
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.observability.svc.cluster.local:3100
      access: proxy
    - name: Tempo
      type: tempo
      url: http://tempo.observability.svc.cluster.local:3100
      access: proxy

# kube-state-metrics and node-exporter are on by default — leave them on,
# they're the lightest pieces of this chart (~50-100Mi each) and give you
# pod/node-level dashboards for free.
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true

# Trino and Kestra don't get scraped automatically — add ServiceMonitors
# for them once you confirm what each exposes:
#   - Trino: JMX metrics need the jmx_exporter javaagent (not wired up in
#     helm-values/trino-values.yaml yet — add it if you want Trino query
#     metrics in Grafana).
#   - Kestra: exposes a built-in /prometheus endpoint — a ServiceMonitor
#     pointed at the kestra Service on that path should work without extra
#     wiring. Worth adding once Kestra is confirmed running.
