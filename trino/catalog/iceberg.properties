# Reference copy only — the version actually used by the running Trino pod
# is generated into a ConfigMap by the Helm chart from
# helm-values/trino-values.yaml's `additionalCatalogs.iceberg` block (with
# AWS_EMULATOR_HOST substituted for floci's real IP by
# scripts/05-deploy-stack.sh). Kept here so the catalog config is easy to
# read/diff without digging through Helm templating.

connector.name=iceberg
iceberg.catalog.type=glue
hive.metastore.glue.endpoint-url=http://AWS_EMULATOR_HOST:4566
hive.s3.aws-access-key=minioadmin
hive.s3.aws-secret-key=minioadmin
hive.s3.endpoint=http://minio.data-plane.svc.cluster.local:9000
hive.s3.path-style-access=true
hive.s3.ssl.enabled=false
iceberg.file-format=PARQUET
